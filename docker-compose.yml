services:
  db:
    image: mysql:8.4
    container_name: estuda-fit-hub-db
    ports:
      - "3316:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: estuda_fit_hub
      MYSQL_USER: estuda_fit_hub
      MYSQL_PASSWORD: estuda_fit_hub
    volumes:
      - db-data:/var/lib/mysql
      # Bancos e usuários separados por sistema (só na primeira subida do volume)
      - ./database/init:/docker-entrypoint-initdb.d:ro
      # Configuração espelhada da produção (ADR-002)
      - ./database/conf/espelho-producao.cnf:/etc/mysql/conf.d/espelho-producao.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  monolito:
    build: .
    container_name: estuda-fit-hub-monolito
    ports:
      - "8080:8080"
    # O código vai na imagem, como em Cobrança. Montar a pasta do host custava ~40 ms por
    # requisição no Docker Desktop e derrubava o p95 da catraca. Em desenvolvimento use
    # `docker compose up --watch`: o php -S relê os arquivos sincronizados a cada requisição.
    develop:
      watch:
        - action: sync
          path: .
          target: /app
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: estuda_fit_hub
      DB_USER: estuda_fit_hub
      DB_PASS: estuda_fit_hub
      # Latencia simulada das integracoes externas (ms). Aumente para sentir o acoplamento.
      NOTIFICACAO_LATENCIA_MS: "150"
      GATEWAY_LATENCIA_MS: "2"
      # Cada worker do php -S atende uma requisição por vez; com 4, uma requisição lenta não segura a catraca.
      PHP_CLI_SERVER_WORKERS: "4"
      # Feeds de eventos (ADR-005). Tokens apenas de desenvolvimento.
      EVENTOS_TOKEN: dev-token-feed-monolito
      COBRANCA_EVENTOS_URL: http://cobranca:8081/eventos
      COBRANCA_EVENTOS_TOKEN: dev-token-feed-cobranca
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Lê o feed de eventos de Cobrança e aplica no monólito (cópia de faturas, e-mails).
  monolito-consumidor:
    build: .
    container_name: estuda-fit-hub-monolito-consumidor
    command: ["php", "bin/console", "eventos:consumir"]
    # Saudável se o laço do consumidor atualizou o sinal de vida no último minuto.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/consumidor-vivo -mmin -1 | grep -q ."]
      interval: 5s
      timeout: 5s
      retries: 30
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: estuda_fit_hub
      DB_USER: estuda_fit_hub
      DB_PASS: estuda_fit_hub
      NOTIFICACAO_LATENCIA_MS: "150"
      COBRANCA_EVENTOS_URL: http://cobranca:8081/eventos
      COBRANCA_EVENTOS_TOKEN: dev-token-feed-cobranca
    depends_on:
      monolito:
        condition: service_healthy
    restart: unless-stopped

  cobranca:
    build:
      context: ./cobranca
      target: dev
    container_name: estuda-fit-hub-cobranca
    ports:
      - "8081:8081"
    # Em desenvolvimento use `docker compose up --watch`: sincroniza o código,
    # reinicia o Octane e reconstrói a imagem quando as dependências mudam.
    develop:
      watch:
        - action: rebuild
          path: ./cobranca/composer.lock
        - action: sync
          path: ./cobranca/tests
          target: /app/tests
        - action: sync+restart
          path: ./cobranca
          target: /app
          ignore:
            - vendor/
            - tests/
            - storage/
    environment:
      APP_NAME: cobranca
      APP_ENV: local
      # Chave apenas de desenvolvimento
      APP_KEY: base64:mJ1Ow5UqWx8fN1rT2p0nH3yGv6aKcL9sQeZdXbIoPuA=
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      # Logs JSON no formato da ADR-003, sem os valores das consultas nos erros de banco.
      LOG_STDERR_FORMATTER: App\Logging\FormatoJson
      LOG_LEVEL: info
      DB_MASK_BINDINGS: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: cobranca
      DB_USERNAME: cobranca
      DB_PASSWORD: cobranca
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: database
      OCTANE_SERVER: frankenphp
      OCTANE_WORKERS: "4"
      # Feeds de eventos (ADR-005). Tokens apenas de desenvolvimento.
      EVENTOS_TOKEN: dev-token-feed-cobranca
      MONOLITO_EVENTOS_URL: http://monolito:8080/eventos
      MONOLITO_EVENTOS_TOKEN: dev-token-feed-monolito
      GATEWAY_LATENCIA_MS: "2"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/up"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Lê o feed de eventos do monólito e aplica em Cobrança (gera as faturas).
  cobranca-consumidor:
    build:
      context: ./cobranca
      target: dev
    container_name: estuda-fit-hub-cobranca-consumidor
    entrypoint: ["php", "artisan", "eventos:consumir"]
    # Saudável se o laço do consumidor atualizou o sinal de vida no último minuto.
    healthcheck:
      test: ["CMD-SHELL", "find /app/storage/framework/consumidor-vivo -mmin -1 | grep -q ."]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      APP_KEY: base64:mJ1Ow5UqWx8fN1rT2p0nH3yGv6aKcL9sQeZdXbIoPuA=
      LOG_CHANNEL: stderr
      # Logs JSON no formato da ADR-003, sem os valores das consultas nos erros de banco.
      LOG_STDERR_FORMATTER: App\Logging\FormatoJson
      LOG_LEVEL: info
      DB_MASK_BINDINGS: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: cobranca
      DB_USERNAME: cobranca
      DB_PASSWORD: cobranca
      CACHE_STORE: array
      MONOLITO_EVENTOS_URL: http://monolito:8080/eventos
      MONOLITO_EVENTOS_TOKEN: dev-token-feed-monolito
      GATEWAY_LATENCIA_MS: "2"
    depends_on:
      cobranca:
        condition: service_healthy
      monolito:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./cobranca
          ignore:
            - vendor/
            - tests/
    restart: unless-stopped

  # Gerador de carga dos testes de desempenho. Só sobe sob demanda: make perf.
  carga:
    build: ./scripts/carga
    profiles: ["ferramentas"]

volumes:
  db-data:
